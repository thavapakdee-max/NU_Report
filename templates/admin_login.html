{% extends "base.html" %}
{% block title %}เข้าสู่ระบบเจ้าหน้าที่{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<main class="login-layout">
  <a href="{{ url_for('home') }}" class="back-link">← กลับหน้าหลัก</a>
  <section class="login-card">
    <img class="brand-seal brand-seal-large logo-image" src="{{ url_for('static', filename='images/logo.png') }}" alt="ตรามหาวิทยาลัยนเรศวร">
    <span class="eyebrow">ADMIN PORTAL</span>
    <h1>เข้าสู่ระบบเจ้าหน้าที่</h1>
    <p class="muted">จัดการข้อมูลและดูผลการประเมิน</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required placeholder="ชื่อผู้ใช้"></label>
      <label>รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required placeholder="รหัสผ่าน"></label>
      <button class="button button-primary button-full" type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>
</main>
{% endblock %}
